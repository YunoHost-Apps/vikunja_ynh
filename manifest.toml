#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "vikunja"
name = "Vikunja"
description.en = "Self-hosted To-Do list application"
description.fr = "Application de liste de tâches auto-hébergée"

version = "2.7.1~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
website = "https://vikunja.io/"
demo = "https://try.vikunja.io/login"
admindoc = "https://vikunja.io/docs/"
code = "https://github.com/go-vikunja/vikunja"
fund = "https://www.buymeacoffee.com/kolaente"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = true
sso = false

disk = "50M"
ram.build = "1500M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    help.en = "If 'visitors', Vikunja will be accessible by people who do not have an account. This can be changed later via the webadmin."
    help.fr = "Si 'visiteurs', Vikunja sera accessible aux personnes n’ayant pas de compte. Vous pourrez changer ceci plus tard via la webadmin."
    type = "group"
    default = "visitors"

    [install.language]
    ask.en = "Choose the application language"
    ask.fr = "Choisissez la langue de l'application"
    type = "select"
    choices = ["de-DE", "en", "es-ES", "fr-FR", "it-IT", "nl-NL", "pt-PT"]
    default = "fr-FR"

[resources]

    [resources.sources]

        [resources.sources.main]
        amd64.url = "https://github.com/go-vikunja/vikunja/releases/download/v2.7.1/vikunja-v2.7.1-linux-amd64-full.zip"
        amd64.sha256 = "2d0b64a477341977958067a42a32655b74f5e72e6eb02f57942faa19d9ee76ad"
        arm64.url = "https://github.com/go-vikunja/vikunja/releases/download/v2.7.1/vikunja-v2.7.1-linux-arm64-full.zip"
        arm64.sha256 = "f9336d8918e99cfadb9ed6f58f8d1a2b30ed30f7393ca2b98dbb3c8abfbdfcfd"
        armhf.url = "https://github.com/go-vikunja/vikunja/releases/download/v2.7.1/vikunja-v2.7.1-linux-arm-7-full.zip"
        armhf.sha256 = "fdb263356f2e558a8012935a1b103f8277e29ed7bf37cb5391fbf5ea1bd28873"
        in_subdir = false
        format = "zip"

        autoupdate.strategy = "latest_github_release"
        autoupdate.asset.amd64 = 'vikunja-.*-linux-amd64-full.zip'
        autoupdate.asset.arm64 = 'vikunja-.*-linux-arm64-full.zip'
        autoupdate.asset.armhf = 'vikunja-.*-linux-arm-7-full.zip'

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.data_dir]
    
    [resources.permissions]
    main.url = "/"
    api.url = "/api"
    api.show_tile = false
    api.allowed = "visitors"
    api.auth_header = false

    [resources.ports]
    
    [resources.apt]
    packages = ["postgresql", "redis-server"]

    [resources.database]
    type = "postgresql"
